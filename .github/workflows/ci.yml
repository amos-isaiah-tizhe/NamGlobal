name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      SITE_NAME: Nam Global
      SITE_URL: https://namsglobal.com
      CONTACT_EMAIL: hello@namsglobal.com
      SESSION_SECRET: ci-test-secret-not-used-anywhere-real
      MONGODB_URI: mongodb://localhost:27017/nam_global_test
      REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all source files
        run: |
          for f in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node -c "$f" || exit 1
          done

      - name: Run migrations against the test database
        run: npm run migrate:up

      # Section 2.19 — the real Jest/Supertest suite (Stage 13), running
      # against the Mongo/Redis service containers defined above.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Dependency vulnerability scan (Section 2.7)
        run: npm audit --audit-level=high
        continue-on-error: true # tighten to a hard failure once the baseline is clean
