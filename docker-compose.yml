# Local development only. Production uses MongoDB Atlas + Upstash Redis
# (Section 2.21 free tier) rather than these containers.
version: "3.8"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/nam_global
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  worker:
    build: .
    command: ["node", "worker.js"]
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/nam_global
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo-data:
  redis-data:
