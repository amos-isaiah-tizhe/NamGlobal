<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="faviconTitle">
  <title id="faviconTitle">Nam Global icon</title>
  <defs>
    <linearGradient id="favGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7941D"/>
      <stop offset="100%" stop-color="#ED1C24"/>
    </linearGradient>
  </defs>

  <g transform="translate(4,4) scale(1.0)">
    <!-- left leg of the "n" -->
    <path d="M15 9
             C15 4 19 1 23 1
             C27 1 31 4 31 9
             L31 104
             C31 110 26 115 20 115
             C14 115 9 110 9 104
             L9 41"
          fill="none" stroke="url(#favGradient)" stroke-width="17" stroke-linecap="round"/>

    <!-- arch of the "n" -->
    <path d="M19 52
             C19 28 41 10 65 10
             C89 10 108 28 108 51
             L108 89"
          fill="none" stroke="url(#favGradient)" stroke-width="17" stroke-linecap="round"/>

    <!-- right leg of the "n" -->
    <path d="M108 51
             L108 104
             C108 110 113 114 119 114
             C124 114 128 110 128 105"
          fill="none" stroke="url(#favGradient)" stroke-width="17" stroke-linecap="round"/>

    <!-- wheel / dot accent -->
    <circle cx="65" cy="126" r="8.5" fill="url(#favGradient)"/>
  </g>
</svg>
