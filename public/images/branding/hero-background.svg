<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" role="img" aria-labelledby="heroBgTitle">
  <title id="heroBgTitle">Faint gadget line-art background pattern</title>
  <defs>
    <pattern id="gadgetTile" width="400" height="400" patternUnits="userSpaceOnUse">
      <g stroke="#d9d9de" stroke-width="2.2" fill="none" opacity="0.55" stroke-linecap="round" stroke-linejoin="round">

        <!-- headphones -->
        <g transform="translate(30,30) rotate(-8)">
          <path d="M4 46 C4 20 24 2 48 2 C72 2 92 20 92 46"/>
          <rect x="0" y="42" width="16" height="26" rx="6"/>
          <rect x="80" y="42" width="16" height="26" rx="6"/>
        </g>

        <!-- game controller -->
        <g transform="translate(230,60) rotate(6)">
          <path d="M6 20 C6 8 16 0 28 0 L64 0 C76 0 86 8 86 20 L92 40 C96 52 90 62 78 62 C70 62 64 58 60 50 L32 50 C28 58 22 62 14 62 C2 62 -4 52 0 40 Z"/>
          <line x1="16" y1="24" x2="16" y2="36"/>
          <line x1="10" y1="30" x2="22" y2="30"/>
          <circle cx="70" cy="20" r="4"/>
          <circle cx="80" cy="30" r="4"/>
        </g>

        <!-- tablet / phone -->
        <g transform="translate(120,180) rotate(-4)">
          <rect x="0" y="0" width="56" height="86" rx="9"/>
          <line x1="20" y1="76" x2="36" y2="76"/>
        </g>

        <!-- camera -->
        <g transform="translate(260,220) rotate(5)">
          <rect x="0" y="14" width="70" height="48" rx="6"/>
          <rect x="18" y="0" width="24" height="14" rx="3"/>
          <circle cx="35" cy="38" r="16"/>
          <circle cx="35" cy="38" r="8"/>
        </g>

        <!-- smartwatch -->
        <g transform="translate(20,250) rotate(-10)">
          <rect x="14" y="10" width="30" height="38" rx="8"/>
          <path d="M20 10 L20 0 M38 10 L38 0"/>
          <path d="M20 48 L20 60 M38 48 L38 60"/>
        </g>

        <!-- earbuds case -->
        <g transform="translate(320,330) rotate(3)">
          <rect x="0" y="6" width="44" height="34" rx="10"/>
          <line x1="0" y1="18" x2="44" y2="18"/>
        </g>

        <!-- speaker / bluetooth accent -->
        <g transform="translate(150,320) rotate(0)">
          <rect x="0" y="0" width="24" height="46" rx="10"/>
          <circle cx="12" cy="14" r="4"/>
          <circle cx="12" cy="32" r="4"/>
        </g>

      </g>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>
  <rect x="0" y="0" width="1280" height="900" fill="url(#gadgetTile)"/>
</svg>
